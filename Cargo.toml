[package]
name = "bmad-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
rig-core = "0.30"
git2 = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
dialoguer = "0.12"
chrono = "0.4"
octocrab = "0.49"
http = "1.4.0"
reqwest = { version = "0.13", features = ["json", "form"] }
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
async-trait = "0.1"
regex = "1"
futures = "0.3"
rustls = { version = "0.23", features = ["ring"] }

[dev-dependencies]
snafu = "0.8.9"
tempfile = "3"
